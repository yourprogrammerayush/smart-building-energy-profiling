name: Publish site to GitHub Pages

# Optional mirror of the live Vercel deployment.
# Enable once: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# The published site is the same single-file application served at
# https://smart-building-energy-profiling.vercel.app

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          # Single-file app that is actually deployed to Vercel.
          # Swap to `site` to publish the full multi-file version instead.
          path: deploy
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq .total_count) && [[ "$count" == 1 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact was not registered in time" >&2
          exit 1

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
