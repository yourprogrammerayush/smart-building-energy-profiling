name: Publish site to GitHub Pages

# Canonical publication of the project site.
# Enable once: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# The published site is https://yourprogrammerayush.github.io/smart-building-energy-profiling/

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          # Self-contained site: index.html + same-origin artefact copies.
          path: deploy

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
